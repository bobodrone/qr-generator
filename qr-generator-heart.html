<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Code Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --red: #FF0000;
    --bg: #0f0f10;
    --panel: #1a1a1c;
    --text: #f2f2f2;
    --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid #2a2a2c;
    border-radius: 16px;
    padding: 36px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px 0;
    letter-spacing: -0.01em;
  }
  p.sub {
    margin: 0 0 24px 0;
    color: var(--muted);
    font-size: 13px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #111;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--red); }
  .row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  button {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.06s, filter 0.15s;
  }
  button:active { transform: scale(0.98); }
  #generateBtn {
    background: var(--red);
    color: white;
  }
  #generateBtn:hover { filter: brightness(1.1); }
  #saveBtn {
    background: #262626;
    color: var(--text);
    border: 1px solid #3a3a3a;
  }
  #saveBtn:hover { filter: brightness(1.2); }
  #saveBtn:disabled, #generateBtn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .qr-wrap {
    margin-top: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 280px;
  }
  #qrOutput {
    position: relative;
    display: inline-block;
    padding: 16px;
    background: white;
    border-radius: 12px;
  }
  #qrOutput canvas, #qrOutput img {
    display: block;
    border-radius: 4px;
  }
  .placeholder {
    color: #555;
    font-size: 13px;
    text-align: center;
  }
  .hint {
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <h1>QR Code Generator</h1>
  <p class="sub">Enter a URL, generate, then save the image.</p>

  <label for="urlInput">URL</label>
  <input type="text" id="urlInput" placeholder="https://example.com" autocomplete="off">

  <div class="row">
    <button id="generateBtn">Generate</button>
    <button id="saveBtn" disabled>Save Image</button>
  </div>

  <div class="qr-wrap" id="qrWrap">
    <div class="placeholder" id="placeholder">Your QR code will appear here</div>
  </div>
  <div class="hint" id="hint" style="display:none">Right pane shows a preview — click "Save Image" to download the PNG.</div>
</div>

const QR_SIZE = 320;

  qrWrap.innerHTML = '';
  const container = document.createElement('div');
  container.id = 'qrOutput';

  const temp = document.createElement('div');
  temp.style.display = 'none';
  document.body.appendChild(temp);

    text: text,
    width: QR_SIZE,
    height: QR_SIZE,
    colorDark: RED,
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H // high error correction so the logo can cover the center

    const sourceCanvas = temp.querySelector('canvas');
    const finalC = document.createElement('canvas');
    finalC.width = QR_SIZE;
    finalC.height = QR_SIZE;
    const ctx = finalC.getContext('2d');

    if (sourceCanvas) {
      ctx.drawImage(sourceCanvas, 0, 0, QR_SIZE, QR_SIZE);
    } else {
      // Fallback: some browsers render an <img> instead of canvas
      const sourceImg = temp.querySelector('img');
      ctx.drawImage(sourceImg, 0, 0, QR_SIZE, QR_SIZE);
    }

    // Draw logo in the center with a white padded box behind it for scan reliability
    const logo = new Image();
    logo.onload = () => {
      const boxSize = QR_SIZE * 0.30;
      const boxX = (QR_SIZE - boxSize) / 2;
      const boxY = (QR_SIZE - boxSize) / 2;

      ctx.fillStyle = "#ffffff";
      const radius = 8;
      roundRect(ctx, boxX - 6, boxY - 6, boxSize + 12, boxSize + 12, radius);
      ctx.fill();

      // fit logo (preserving aspect ratio) within the box
      const scale = Math.min(boxSize / logo.width, boxSize / logo.height) * 0.85;
      const w = logo.width * scale;
      const h = logo.height * scale;
      const x = (QR_SIZE - w) / 2;
      const y = (QR_SIZE - h) / 2;
      ctx.drawImage(logo, x, y, w, h);

      container.appendChild(finalC);
      finalCanvas = finalC;
      saveBtn.disabled = false;
      hint.style.display = 'block';
      document.body.removeChild(temp);
    };
    logo.src = LOGO_DATA_URI;
  }, 60);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function normalizeUrl(value) {
  const v = value.trim();
  if (!v) return '';
  if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(v)) {
    return 'https://' + v;
  }
  return v;
}

generateBtn.addEventListener('click', () => {
  const raw = urlInput.value;
  const url = normalizeUrl(raw);
  if (!url) {
    urlInput.focus();
    return;
  }
  saveBtn.disabled = true;
  placeholder.style.display = 'none';
  buildQR(url);
});

urlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') generateBtn.click();
});

saveBtn.addEventListener('click', () => {
  if (!finalCanvas) return;
  const link = document.createElement('a');
  link.download = 'qr-code.png';
  link.href = finalCanvas.toDataURL('image/png');
  link.click();
});
</script>
